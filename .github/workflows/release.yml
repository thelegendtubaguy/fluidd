name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}

permissions: {}

jobs:
  build:
    name: Build
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    uses: ./.github/workflows/_build.yml
    permissions:
      contents: read

  publish-docker:
    name: Publish
    needs: build
    if: ${{ github.repository == 'fluidd-core/fluidd' }}
    uses: ./.github/workflows/_publish-docker.yml
    permissions:
      id-token: write
      contents: read
      attestations: write
      packages: write
      artifact-metadata: write

  release:
    name: Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download fluidd dist
        uses: actions/download-artifact@v8
        with:
          name: fluidd-${{ github.sha }}
          path: ./dist

      - name: Check fork release version
        if: ${{ github.repository != 'fluidd-core/fluidd' }}
        run: |
          test "$(jq -r .version ./dist/release_info.json)" = "${GITHUB_REF_NAME}"

      # The QIDI Max 4 installer's nginx serves these with gzip_static instead of compressing each request on the
      # printer. -n leaves out the name and timestamp, so the copies depend only on the build.
      - name: Precompress assets
        if: ${{ github.repository != 'fluidd-core/fluidd' }}
        run: |
          find ./dist -type f \( -name '*.js' -o -name '*.mjs' -o -name '*.css' -o -name '*.html' -o -name '*.json' \
            -o -name '*.svg' -o -name '*.webmanifest' -o -name '*.txt' -o -name '*.ico' \) -exec gzip -9 -k -n {} +

      - name: Create Artifact
        run: |
          cd ./dist
          zip -r ../fluidd.zip ./

      - name: Attest fluidd.zip
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: ./fluidd.zip

      - name: Get version from tag
        id: tag_name
        run: |
          echo "current_version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Read ChangeLog
        if: ${{ github.repository == 'fluidd-core/fluidd' }}
        uses: mindsers/changelog-reader-action@1faaf50aa09d5793d9a100819973df801febfb31 # v2.4.0
        id: changelog
        with:
          validation_depth: 1
          version: ${{ steps.tag_name.outputs.current_version }}
          path: ./CHANGELOG.md

      - name: Create Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: ${{ steps.tag_name.outputs.current_version }}
          body: ${{ steps.changelog.outputs.changes }}
          # Fork releases (vX.Y.Z-tltg-<hash>) list their merged pull requests instead of the upstream changelog.
          generate_release_notes: ${{ github.repository != 'fluidd-core/fluidd' }}
          files: ./fluidd.zip
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') }}

  publish-web:
    name: Deploy to Host
    needs: build
    if: ${{ github.repository == 'fluidd-core/fluidd' }}
    uses: ./.github/workflows/_publish-web.yml
    secrets:
      bucket: ${{ secrets.S3_BUCKET_NAME }}
      distribution-id: ${{ secrets.CF_DISTRIBUTION_ID }}
      aws-role: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE }}
    permissions:
      id-token: write
      contents: read
